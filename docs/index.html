<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmSyncer Docs</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f4ef;
      --paper: #fffdf8;
      --ink: #1f2933;
      --muted: #52606d;
      --accent: #0f766e;
      --line: #d9e2ec;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top right, rgba(15, 118, 110, 0.08), transparent 28%),
        linear-gradient(180deg, #f9f7f2 0%, var(--bg) 100%);
      color: var(--ink);
      line-height: 1.6;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    article {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 36px 28px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.06);
    }

    h1, h2 {
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
      line-height: 1.2;
      margin-top: 0;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      margin-bottom: 0.4rem;
    }

    h2 {
      font-size: 1.35rem;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      color: var(--accent);
    }

    p, li {
      font-size: 1rem;
    }

    .updated {
      color: var(--muted);
      margin-top: 0;
      margin-bottom: 1.5rem;
    }

    ul {
      padding-left: 1.4rem;
    }

    a {
      color: var(--accent);
    }

    @media (max-width: 640px) {
      main {
        padding: 24px 12px 40px;
      }

      article {
        padding: 24px 18px;
        border-radius: 14px;
      }
    }

  </style>
</head>
<body>
  <main>
    <article>
      <!-- Generated from scripts/generate_docs_html.py. Do not edit this file directly. -->
      <h1>OmSyncer Docs</h1>
      <p>Available documents:</p>
      <p><a href="./privacy-policy.html">Privacy Policy</a></p>
    </article>
  </main>
</body>
</html>
